services:
  flooding:
    build: ./frontend
    init: true
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    init: true
    environment:
      PORT: "5000"
      STATE_FILE: /data/game-state.json
      HISTORY_DIR: /history
      TZ: Asia/Singapore
      CONTROLLER_LEASE_MS: "45000"
      MAX_REQUESTS_PER_MINUTE: "1200"
      ROUND_DURATION_MS: "180000"
      RESIDENTS_TOKEN: ${RESIDENTS_TOKEN:?Set RESIDENTS_TOKEN in .env}
      INDUSTRIALISTS_TOKEN: ${INDUSTRIALISTS_TOKEN:?Set INDUSTRIALISTS_TOKEN in .env}
      MODERATOR_TOKEN: ${MODERATOR_TOKEN:?Set MODERATOR_TOKEN in .env}
    volumes:
      - game-data:/data
      - ./history:/history
    restart: unless-stopped

volumes:
  game-data:
